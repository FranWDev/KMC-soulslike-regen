plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.78'
}

base {
    archivesName = project.archive_name
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

neoForge {
    version = project.neoforge_version

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }
        server {
            server()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            programArgument '--nogui'
        }
        gameTestServer {
            server()
            gameDirectory = project.file('run-gametest')
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'soulslikeregen.testMode', 'true'
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenLocal()
    mavenCentral()
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
        content {
            includeGroup 'curse.maven'
        }
    }
    maven {
        name = 'NeoForged'
        url = 'https://maven.neoforged.net/releases'
    }
    maven { url = 'https://maven.architectury.dev/' }
    maven { url = 'https://maven.ftb.dev/releases' }
    maven { url = 'https://maven.saps.dev/minecraft' }
    maven { url = 'https://maven.twelveiterations.com/repository/maven-public/' }
    maven { url = 'https://maven.blamejared.com' }
    maven { url = 'https://modmaven.dev' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    // Optional integrations from CurseMaven
    implementation "curse.maven:waystones-${project.waystones_cf_id}"
    implementation "curse.maven:balm-${project.balm_cf_id}"
    implementation "curse.maven:ftb-teams-forge-${project.ftbteams_cf_id}"

    // Unit test dependencies
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.0'
}

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
        minecraft_version: minecraft_version,
        neoforge_version : neoforge_version,
        mod_id           : mod_id,
        mod_name         : mod_name,
        mod_license      : mod_license,
        version          : version,
        mod_author       : mod_author
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar) {
    archiveBaseName = project.archive_name
    manifest {
        attributes([
            'Specification-Title'   : mod_id,
            'Specification-Vendor'  : mod_author,
            'Specification-Version' : '1',
            'Implementation-Title'  : mod_name,
            'Implementation-Version': project.version,
            'Implementation-Vendor' : mod_author
        ])
    }
    exclude 'dev/franwdev/soulslikeregen/gametest/**'
    exclude 'dev/franwdev/soulslikeregen/unit/**'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    exclude '**/gametest/**'
}

processTestResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('copyGameTestStructures', Copy) {
    from file('gameteststructures')
    into file('run-gametest/gameteststructures')
}

tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    dependsOn tasks.named('copyGameTestStructures')
}
